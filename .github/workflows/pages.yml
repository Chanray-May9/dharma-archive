name: Verify archive and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python tools/verify.py public --metadata-only
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/worker.test.mjs
      - run: python tools/stage_pages.py public pages-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
