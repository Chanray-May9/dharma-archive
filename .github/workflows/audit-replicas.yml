name: Audit public preservation replicas
on:
  workflow_dispatch:
  schedule:
    - cron: '40 1 1 * *'
permissions:
  contents: read
concurrency:
  group: preservation-replica-audit
  cancel-in-progress: false
jobs:
  payload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mirror:
          - github
          - cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read back all payload files
        env:
          MIRROR: ${{ matrix.mirror }}
        run: |
          if [ "$MIRROR" = github ]; then
            BASE=https://raw.githubusercontent.com/Chanray-May9/dharma-archive/main/public
            EXTRA=--allow-shards
          else
            BASE=https://dharma-archive-api.gqr20080509.workers.dev
            EXTRA=
          fi
          python tools/mirror.py check --base "$BASE" --manifest-sha256 3f147f96d93d996abcf617d7042f58fd9e0f47d2d6d4995155e0801acd2ab5af --output audit --workers 4 $EXTRA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ matrix.mirror }}
          path: audit/mirror-receipt.json
          if-no-files-found: ignore
  internet-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read back every split TAR part
        run: python tools/check_distribution.py --base https://archive.org/download/chanray-dharma-archive-buddhist-texts-20261023 --manifest-sha256 247c7656d3432e4148b9f5f7602372015f880d57dc14e4c5d03b4a036ec44acd --receipt audit/internet-archive.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-internet-archive
          path: audit/internet-archive.json
          if-no-files-found: ignore
